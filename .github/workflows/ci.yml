name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # This repository is developed inside a workspace and is cloned here on
      # its own, so it has to be detached before anything can
      # resolve. See the script for what that means and why the detached tree
      # is the one worth checking.
      - name: Detach from the workspace
        run: .github/tool/detach_workspace.sh

      - run: dart pub get

      - run: dart format --output=none --set-exit-if-changed .

      - run: dart analyze --fatal-infos

      - run: dart test

      # The per-element cache is sound only because the analyzer hands back
      # fresh element objects for edited files. That is its guarantee, not
      # ours, so it is checked rather than assumed.
      - name: Verify cache invalidation
        run: dart run tool/verify_cache_invalidation.dart

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Detach from the workspace
        run: .github/tool/detach_workspace.sh

      # `dart pub publish` refuses a dirty tree, and detaching necessarily
      # dirties it. Committing locally is enough to satisfy that check, and
      # the commit goes nowhere: this checkout is thrown away with the runner.
      - name: Commit the detached state
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit --quiet --all --message 'ci: detach for validation'

      - run: dart pub get

      - run: dart pub publish --dry-run
