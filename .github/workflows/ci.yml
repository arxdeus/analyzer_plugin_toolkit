name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - run: dart format --output=none --set-exit-if-changed .

      - run: dart analyze --fatal-infos

      - run: dart test

      # The per-element cache is sound only because the analyzer hands back
      # fresh element objects for edited files. That is its guarantee, not
      # ours, so it is checked rather than assumed.
      - name: Verify cache invalidation
        run: dart run tool/verify_cache_invalidation.dart

  # The example resolves this package from pub.dev, which is what makes it a
  # faithful demonstration but also means it would otherwise be analysed
  # against the last release rather than the commit under test. The override
  # closes that gap, and is written here rather than committed so that a reader
  # cloning the example gets the consumer's resolution.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Point the example at this commit
        run: |
          cat > example/pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            analyzer_plugin_toolkit:
              path: ../
          YAML

      - run: dart pub get
        working-directory: example

      - run: dart analyze --fatal-infos
        working-directory: example

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - run: dart pub publish --dry-run
