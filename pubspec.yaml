name: analyzer_plugin_toolkit
description: >-
  Building blocks for annotation-driven Dart analyzer plugins: annotation
  lookup that resolves by package, per-element memoization, element
  normalization and local alias resolution.
version: 1.0.0
homepage: https://github.com/arxdeus/analyzer_plugin_toolkit
repository: https://github.com/arxdeus/analyzer_plugin_toolkit
issue_tracker: https://github.com/arxdeus/analyzer_plugin_toolkit/issues

funding:
  - https://ko-fi.com/arxdeus

topics:
  - analyzer
  - analyzer-plugin
  - lints
  - static-analysis

environment:
  sdk: ^3.13.2

dependencies:
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0
  analyzer_plugin: ^0.14.17

dev_dependencies:
  analyzer_testing: ^0.4.2
  arxdeus_lints: ^1.0.0
  test: ^1.25.6
  test_reflective_loader: ^0.4.0
