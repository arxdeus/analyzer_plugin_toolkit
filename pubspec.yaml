name: analyzer_plugin_toolkit
# Kept between 60 and 180 characters: pana scores the length, and a search
# result shows only the beginning. The detail this drops is in the README.
description: >-
  Building blocks for annotation-driven Dart analyzer plugins: annotation
  lookup that resolves by package, per-element memoization, element
  normalization and local alias resolution.
version: 1.0.0
repository: https://github.com/arxdeus/analyzer_plugin_toolkit
issue_tracker: https://github.com/arxdeus/analyzer_plugin_toolkit/issues

# Shown on pub.dev and searchable there. Only the vocabulary pub.dev accepts:
# lowercase, hyphenated, no `dart` or `flutter`.
topics:
  - analyzer
  - analyzer-plugin
  - lints
  - static-analysis

environment:
  sdk: ^3.13.2

dependencies:
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0
  analyzer_plugin: ^0.14.17

dev_dependencies:
  analyzer_testing: ^0.4.2
  # Only for the shared lint configuration in analysis_options.yaml, which is
  # a data file rather than code: nothing in lib/ imports arxdeus_lints.
  arxdeus_lints: ^1.0.0
  test: ^1.25.6
  test_reflective_loader: ^0.4.0
