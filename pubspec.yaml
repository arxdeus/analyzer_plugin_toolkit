name: analyzer_plugin_toolkit
description: >-
  Shared building blocks for annotation-driven Dart analyzer plugins:
  per-element memoization, annotation lookup that resolves by package rather
  than by name alone, element normalization, and a harness for testing quick
  fixes through the real fix processor.
version: 1.0.0
repository: https://github.com/arxdeus/arxdeus_lints

environment:
  sdk: ^3.13.2

dependencies:
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0
  analyzer_plugin: ^0.14.17
  # NOTE: `analyzer_testing` and `test` are deliberately *not* dependencies
  # here, even though `lib/testing.dart` imports them.
  #
  # A regular dependency would reach every consumer's dependency graph, and
  # `test` cannot coexist with the `test_api` that `flutter_test` pins: a
  # Flutter package depending on a plugin built on this toolkit would fail to
  # resolve at all. Since `lib/testing.dart` is only ever imported from a
  # consumer's own `test/` directory, that consumer already has both packages
  # in its dev_dependencies, which is where they belong.
  #
  # They are dev_dependencies below, so this package's own tests still run.

dev_dependencies:
  # Only for the shared lint configuration in analysis_options.yaml, which is
  # a data file rather than code: nothing in lib/ imports arxdeus_lints. Pub
  # resolves dev_dependencies only for the package being developed, so this
  # does not become a cycle for anyone depending on the toolkit.
  arxdeus_lints: any
  analyzer_testing: ^0.4.2
  test: ^1.25.6
  test_reflective_loader: ^0.4.0

dependency_overrides:
  arxdeus_lints:
    path: ../../
